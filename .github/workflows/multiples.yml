name: Múltiplos del S&P 500 y sectores

on:
  schedule:
    - cron: "17 12 * * 6"     # sábados 9:17 de Buenos Aires
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: multiples
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Armar multiples.json y spx.json
        run: node scripts/multiples.mjs
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiples.json spx.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "múltiplos: actualización semanal"
          git pull --rebase -q
          git push
