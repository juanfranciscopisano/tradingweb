name: Series macro (ITCRM, MSCI MERVAL y caución)

on:
  schedule:
    - cron: "23 14 * * 1-5"   # 11:23 de Buenos Aires: el BCRA actualiza la planilla del ITCRM a la mañana
    - cron: "23 22 * * 1-5"   # y de nuevo a la noche por si la subió tarde
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bajar ITCRM (BCRA), MSCI MERVAL y caución (BYMA) y monedas de la región
        run: node scripts/macro.mjs
        env:
          CMF_KEY: ${{ secrets.CMF_KEY }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in itcrm.json merval.json cauciones.json fx.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "macro: ITCRM, MSCI MERVAL y caución"
          git pull --rebase -q
          git push
