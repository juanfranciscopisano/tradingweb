name: 1816 FCI (fondos)

on:
  schedule:
    - cron: "17 13 * * 1-5"   # 10:17 de Buenos Aires: la CAFCI publica el día anterior a la mañana
    - cron: "17 22 * * 1-5"   # y a la noche por si llegó tarde
  workflow_dispatch:
    inputs:
      modo:
        description: "diario: lo de la pestaña Fondos (fondos.json); explora: dimensiones, filtros y créditos; cuenta: filas y muestras"
        required: false
        default: "diario"

permissions:
  contents: write

concurrency:
  group: fci
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consultar la API de FCI de 1816
        run: node scripts/fci1816.mjs
        env:
          API_1816_FCI_KEY: ${{ secrets.API_1816_FCI_KEY }}
          MODO: ${{ inputs.modo || 'diario' }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in fondos.json m1816-fci-explora.json m1816-fci-cuenta.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "1816 FCI: ${{ inputs.modo || 'diario' }}"
          git pull --rebase -q
          git push
