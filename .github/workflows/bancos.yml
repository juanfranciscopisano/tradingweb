name: Bancos (P/VL y ROE)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "diario: bancos.json; diagnostico: qué trae cada fuente, solo en el log"
        required: false
        default: "diagnostico"

permissions:
  contents: write

concurrency:
  group: bancos
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bancos
        run: node scripts/bancos.mjs
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          MODO: ${{ inputs.modo || 'diario' }}
