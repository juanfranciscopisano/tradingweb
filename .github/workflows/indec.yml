name: INDEC (API del INDEC)

on:
  schedule:
    - cron: "37 19 * * 1-5"   # 16:37 de Buenos Aires: el INDEC publica a las 16
    - cron: "37 22 * * 1-5"   # 19:37, por si tardó
    # sin período nuevo, cada corrida hace un pedido por servicio (nueve)
  push:
    branches: [main]
    paths: ["scripts/indec.mjs", ".github/workflows/indec.yml"]
  workflow_dispatch:
    inputs:
      modo:
        description: "diario: las series del Informe (indec.json); diagnostico: el mismo pedido con y sin token, solo en el log"
        required: false
        default: "diario"

permissions:
  contents: write

concurrency:
  group: indec
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # lo último de main, no el commit del disparo: dos corridas seguidas no chocan con indec.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consultar la API del INDEC
        run: node scripts/indec.mjs
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
          MODO: ${{ inputs.modo || 'diario' }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in indec.json indec-explora.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "INDEC: series del Informe"
          git pull --rebase -X theirs -q   # si igual choca, manda lo de esta corrida (indec.json es generado)
          git push
