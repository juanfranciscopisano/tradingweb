name: 1816 (curvas soberanas y flujos)

on:
  schedule:
    - cron: "41 21 * * 1-5"   # 18:41 de Buenos Aires, con el cierre de BYMA
  workflow_dispatch:
    inputs:
      modo:
        description: "diario: curvas, flujos y montos (soberanos.json); explora: lista curvas e instrumentos; campos: qué campos devuelve cada endpoint"
        required: false
        default: "diario"

permissions:
  contents: write

concurrency:
  group: m1816
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consultar la API de 1816
        run: node scripts/m1816.mjs
        env:
          API_1816_KEY: ${{ secrets.API_1816_KEY }}
          MODO: ${{ inputs.modo || 'diario' }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in soberanos.json m1816-explora.json m1816-campos.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "1816: ${{ inputs.modo || 'diario' }}"
          git pull --rebase -q
          git push
