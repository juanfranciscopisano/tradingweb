name: Fundamentals diarios

on:
  schedule:
    - cron: "47 21 * * 1-5"   # 18:47 de Buenos Aires, después del cierre de Nueva York
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bajar fundamentals
        run: node scripts/fundamentals.mjs
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "fundamentals: actualización diaria"
          git push
